 services:
   db:
     image: postgres:latest
     environment:
       - POSTGRES_DB=deposit_db
       - POSTGRES_USER=admin
       - POSTGRES_PASSWORD=admin
     ports:
       - "5433:5432"
     networks:
       - my_network
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U admin -d deposit_db"]
       interval: 5s
       timeout: 5s
       retries: 5
     volumes:
       - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh

   app:
     build: .
     volumes:
       - .:/app
     ports:
       - "8000:8000"
     depends_on:
       db:
         condition: service_healthy
     restart: always
     networks:
       - my_network

 networks:
   my_network:
     driver: bridge
