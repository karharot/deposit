 services:
   db:
     image: postgres:latest
     env_file:
       - .env
     ports:
       - "5433:5432"
     networks:
       - my_network
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
       interval: 5s
       timeout: 5s
       retries: 5
     volumes:
       - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh

   app:
     build: .
     env_file:
       - .env
     volumes:
       - .:/app
     ports:
       - "8000:8000"
     depends_on:
       db:
         condition: service_healthy
     restart: always
     networks:
       - my_network

 networks:
   my_network:
     driver: bridge
